server:
  port: 8085

spring:
  application:
    name: application-service

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: application-group
    topics:
      new-topic: NEW
      rejected-topic: REJECTED
      withdrawn-topic: WITHDRAWN


  clients:
    vacancy-service:
      name: vacancy-service
      url: http://localhost:8083
    company-service:
      name: company-service
      url: http://localhost:8083
    resume-service:
      name: resume-service
      url: http://localhost:8084
    user-service:
      name: user-service
      url: http://localhost:8082


  retry:
    max-attempts: 3
    delay: 1000

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  datasource:
    url: jdbc:postgresql://localhost:5437/applicationdb
    username: applicationuser
    password: applicationpass
  jpa:
    hibernate:
      ddl-auto: none

  logging:
    level:
      org.springframework.cloud.gateway: INFO
      com.vlz: DEBUG
