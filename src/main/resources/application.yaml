server:
  port: 8085

spring:
  application:
    name: application-service

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: application-group
    topics:
      new-topic: NEW
      rejected-topic: REJECTED
      withdrawn-topic: WITHDRAWN


  clients:
    vacancy-service:
      name: vacancy-service
      url: http://localhost:8083
    company-service:
      name: company-service
      url: http://localhost:8083
    resume-service:
      name: resume-service
      url: http://localhost:8084
    user-service:
      name: user-service
      url: http://localhost:8082


  retry:
    max-attempts: 3
    delay: 1000

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  datasource:
    url: jdbc:postgresql://localhost:5437/applicationdb
    username: applicationuser
    password: applicationpass
    hikari:
      maximum-pool-size: 30
      minimum-idle: 10
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
      pool-name: HikariPool-ApplicationService
      leak-detection-threshold: 0
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          batch_size: 25
          fetch_size: 50
        order_inserts: true
        order_updates: true
        batch_versioned_data: true
        generate_statistics: false

  logging:
    level:
      org.springframework.cloud.gateway: INFO
      com.vlz: DEBUG

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    export:
      prometheus:
        enabled: true

resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 30s
        failureRateThreshold: 50
        eventConsumerBufferSize: 10
    instances:
      userService:
        baseConfig: default
      vacancyService:
        baseConfig: default
        waitDurationInOpenState: 15s
      resumeService:
        baseConfig: default
      skillService:
        baseConfig: default
      companyService:
        baseConfig: default

  timelimiter:
    configs:
      default:
        timeoutDuration: 3s
        cancelRunningFuture: true
    instances:
      userService:
        baseConfig: default
      vacancyService:
        timeoutDuration: 5s
      resumeService:
        baseConfig: default
      skillService:
        timeoutDuration: 2s

  retry:
    configs:
      default:
        maxAttempts: 3
        waitDuration: 500ms
        retryExceptions:
          - feign.FeignException.ServiceUnavailable
          - java.net.ConnectException
    instances:
      userService:
        baseConfig: default
      vacancyService:
        baseConfig: default
